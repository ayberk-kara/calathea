<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">One source, two independent listeners</text>

  <!-- source -->
  <rect x="50" y="195" width="215" height="80" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="157" y="230" text-anchor="middle" font-size="15" fill="#1a1a1a">STM32F103</text>
  <text x="157" y="252" text-anchor="middle" font-size="11" fill="#555555">streams fixed-size frames</text>

  <!-- top path: phone (product) -->
  <rect x="345" y="95" width="170" height="60" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="430" y="123" text-anchor="middle" font-size="14" fill="#1a1a1a">native USB</text>
  <text x="430" y="141" text-anchor="middle" font-size="11" fill="#555555">to the phone</text>

  <rect x="595" y="80" width="245" height="92" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="717" y="118" text-anchor="middle" font-size="15" fill="#1a1a1a">Phone</text>
  <text x="717" y="139" text-anchor="middle" font-size="11" fill="#555555">Flutter app</text>
  <text x="717" y="155" text-anchor="middle" font-size="11" fill="#555555">live 12-lead display</text>

  <!-- bottom path: capture (verification, dashed) -->
  <rect x="345" y="320" width="205" height="60" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="447" y="348" text-anchor="middle" font-size="14" fill="#1a1a1a">FT232 second port</text>
  <text x="447" y="366" text-anchor="middle" font-size="11" fill="#555555">independent COM port</text>

  <rect x="595" y="308" width="275" height="84" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="732" y="342" text-anchor="middle" font-size="15" fill="#1a1a1a">Logic analyzer / desktop</text>
  <text x="732" y="363" text-anchor="middle" font-size="11" fill="#555555">off-the-wire frame capture</text>

  <!-- arrows -->
  <path d="M265,218 L320,218 L320,125 L343,125" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="125" x2="593" y2="125" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M265,252 L320,252 L320,350 L343,350" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowg)"/>
  <line x1="550" y1="350" x2="593" y2="350" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowg)"/>

  <text x="455" y="245" font-size="11" fill="#777777">same stream</text>

  <text x="500" y="445" text-anchor="middle" font-size="12" fill="#666666">Dual-capture path used for timing tests and the 8-hour drift run (under 0.02% drift).</text>
</svg>
